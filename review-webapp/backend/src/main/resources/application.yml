server:
  address: ${APP_HOST:127.0.0.1}
  port: ${APP_PORT:8088}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:scx_review}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&sslMode=DISABLED
    username: ${DB_USER:scx_app}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
      encoding: UTF-8
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  admin-password: ${ADMIN_PASSWORD}
  reviewer-password: ${REVIEWER_PASSWORD}
  lock-seconds: 300
